<!-- ── TOPIC DETAIL VIEW ── -->
<div id="topic-detail-view" style="display: none; padding: 120px 5% 60px; min-height: 80vh; position: relative; z-index: 2;">
  
  <div class="topic-detail-card" style="border-radius: 24px; overflow: hidden; width: 100%; max-width: 1400px; margin: 0 auto; backdrop-filter: blur(10px); padding: 4rem 3rem;">
    
    <!-- Breadcrumb -->
    <div style="margin-bottom: 2rem;">
      <nav class="projects-breadcrumb" aria-label="Breadcrumb" style="margin: 0;">
        <ol>
          <li><a href="#" onclick="closeTopicDetail(event)">ProjectsHub</a></li>
          <li><a href="#" onclick="closeTopicDetail(event)">Overview</a></li>
          <li aria-current="page" id="topic-breadcrumb-current">Detail</li>
        </ol>
      </nav>
    </div>

    <!-- Top Area: Title & Image next to each other -->
    <div class="topic-top-area" style="display: flex; justify-content: space-between; align-items: flex-end; gap: 2rem; margin-bottom: 2.5rem;">
      
      <!-- Icon & Title -->
      <div style="flex: 1;">
        <div style="display: flex; align-items: center; gap: 1rem;">
          <div id="topic-icon" style="font-size: 3.5rem; display: none;"></div>
          <h1 id="topic-title" style="font-size: 3.5rem; margin: 0; font-weight: 800; line-height: 1.2; letter-spacing: -0.02em;"></h1>
        </div>
      </div>

      <!-- Right Image -->
      <div id="topic-image-container" style="display: none; flex: 1; text-align: right; position: relative;">
        <div style="position: absolute; width: 80%; height: 80%; top: 10%; right: 0; background: var(--blue-500); filter: blur(100px); opacity: 0.15; z-index: 0; border-radius: 50%;"></div>
        <img id="topic-image" src="" alt="Mentorship Image" style="width: 100%; max-width: 450px; max-height: 300px; object-fit: contain; border-radius: 24px; position: relative; z-index: 1; display: inline-block;" />
      </div>

    </div>

    <!-- Full Width Content Area -->
    <div id="topic-content" style="font-size: 1.15rem; line-height: 1.8; width: 100%;"></div>
    
    <!-- CTA Button -->
    <div style="margin-top: 3rem; padding-top: 2.5rem; border-top: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: center;">
      <button class="btn-primary" onclick="goToContact(event)" style="padding: 1.2rem 3rem; border-radius: 12px; font-size: 1.2rem; font-weight: 600; cursor: pointer; background: var(--blue-500); color: white; border: none; box-shadow: 0 4px 20px rgba(59, 130, 246, 0.4); transition: transform 0.2s, box-shadow 0.2s;">
        Get Started Today
      </button>
    </div>

  </div>
</div>

<style>
  @media (max-width: 992px) {
    .topic-detail-card {
      padding: 2.5rem 1.5rem !important;
    }
    .topic-top-area {
      flex-direction: column !important;
      text-align: center !important;
      align-items: center !important;
    }
    #topic-title {
      font-size: 2.5rem !important;
    }
    #topic-image-container {
      text-align: center !important;
      margin-top: 2rem !important;
    }
    #topic-image {
      max-width: 100% !important;
      max-height: 250px !important;
    }
  }
  .topic-detail-card .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 25px rgba(59, 130, 246, 0.6) !important;
  }
</style>
