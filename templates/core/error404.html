{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Page not found - ProjectsHub" />
    <title>404 Error - ProjectsHub</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@300..900&family=Lexend+Deca:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/@phosphor-icons/web@2.0.3/src/regular.css"
    />
    <!-- Quantum Pulse Loader -->
    <link rel="stylesheet" href="{% static 'css/loader.css' %}" />

    <!-- AI Chatbot -->
    <link rel="stylesheet" href="{% static 'css/ai-chatbot.css' %}" />

    <!-- Floating Social Share -->
    <link rel="stylesheet" href="{% static 'css/social-share.css' %}" />

    <!-- Share Your Idea Modal -->
    <link rel="stylesheet" href="{% static 'css/idea-modal.css' %}" />

    <link rel="stylesheet" href="{% static 'css/main.css' %}" />
    <!-- Favicons -->
    <link rel="icon" type="image/png" href="{% static 'image/ProjectsHub Logo Png For Favicon.png' %}?v=3" />
    <link rel="shortcut icon" type="image/png" href="{% static 'image/ProjectsHub Logo Png For Favicon.png' %}?v=3" />
    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'image/ProjectsHub Logo Png For Favicon.png' %}?v=3" />
    <link rel="manifest" href="{% static 'image/favicon-logos/site.webmanifest' %}?v=3" />
  </head>

  <body class="overflow-x-hidden bg-purple-left">
    <div class="container p-0">
      <div class="row vh-100 justify-content-center">
        <div
          class="col-sm-12 text-center align-self-center"
          style="padding-top: 80px; padding-bottom: 40px"
        >
          <div
            class="error position-relative"
            style="
              display: flex;
              flex-direction: column;
              align-items: center;
              gap: 2rem;
            "
          >
            <!-- Illustrator 404 Image Only -->
            <img
              src="{% static 'image/404-ai-error.png' %}"
              alt="404 Error"
              class="img-fluid"
              style="max-width: 500px; border-radius: 20px"
            />

            <!-- Properly Designed Back Button -->
            <a
              href="/"
              class="btn-hero-primary"
              style="
                text-decoration: none;
                padding: 12px 28px;
                font-size: 1.05rem;
                display: inline-flex;
                align-items: center;
                gap: 10px;
              "
            >
              <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M19 12H5M12 19l-7-7 7-7" />
              </svg>
              Back to Home
            </a>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script
      type="module"
      src="https://unpkg.com/@splinetool/viewer@1.9.82/build/spline-viewer.js"
    ></script>
    <script src="{% static 'js/quantum-pulse-loader.js' %}"></script>
    <script src="{% static 'js/ai-chatbot.js' %}"></script>
    <script src="{% static 'js/social-share.js' %}"></script>
    <script src="{% static 'js/script.js' %}"></script>
  </body>
</html>
