{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Server Error - ProjectsHub" />
    <title>500 - Server Error | ProjectsHub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@300..900&family=Lexend+Deca:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="{% static 'css/bundle.min.css' %}?v=3" />

    <!-- Favicons -->
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'image/Favicon-new/favicon-32x32.png' %}?v=7" />
    <link rel="icon" type="image/png" sizes="16x16" href="{% static 'image/Favicon-new/favicon-16x16.png' %}?v=7" />
    <link rel="shortcut icon" href="{% static 'image/Favicon-new/favicon.ico' %}?v=7" />
    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'image/Favicon-new/apple-touch-icon.png' %}?v=7" />
    <link rel="manifest" href="{% static 'image/Favicon-new/site.webmanifest' %}?v=7" />
  </head>

  <body class="overflow-x-hidden bg-purple-left">
    <div class="container p-0">
      <div class="row vh-100 justify-content-center">
        <div
          class="col-sm-12 text-center align-self-center"
          style="padding-top: 80px; padding-bottom: 40px"
        >
          <div
            class="error position-relative"
            style="
              display: flex;
              flex-direction: column;
              align-items: center;
              gap: 1.5rem;
            "
          >
            <span style="font-size: 5rem; font-weight: 800; background: linear-gradient(135deg, #6366f1, #38bdf8); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;">500</span>
            <h1 style="font-size: 2rem; font-weight: 700; color: #fff; margin: 0;">Internal Server Error</h1>
            <p style="font-size: 1.1rem; color: #9ca3af; max-width: 480px; margin: 0 auto;">Something went wrong on our end. Please try again or return to the homepage.</p>

            <a
              href="/"
              class="btn-hero-primary"
              style="
                text-decoration: none;
                padding: 12px 28px;
                font-size: 1.05rem;
                display: inline-flex;
                align-items: center;
                gap: 10px;
                margin-top: 1rem;
              "
            >
              <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M19 12H5M12 19l-7-7 7-7" />
              </svg>
              Back to Home
            </a>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
  </body>
</html>
