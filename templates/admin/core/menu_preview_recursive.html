<ul style="list-style:none;padding:0;margin:8px 0;">
  {% for item in items %}
    <li style="margin:4px 0;padding:12px 16px;background:white;border-left:3px solid #0073aa;border-radius:4px;margin-left:{{ item.depth|add:0 }}px;">
      <div style="display:flex;align-items:center;gap:8px;">
        {% if item.icon %}
          <span style="font-size:18px;">{{ item.icon }}</span>
        {% endif %}
        <strong>{{ item.label }}</strong>
        {% if item.is_dropdown %}
          <span style="color:#646970;">▾</span>
        {% endif %}
        <span style="color:#8c8f94;font-size:11px;">→ {{ item.destination }}</span>
      </div>
      {% if item.children %}
        {% include "admin/core/menu_preview_recursive.html" with items=item.children %}
      {% endif %}
    </li>
  {% endfor %}
</ul>
